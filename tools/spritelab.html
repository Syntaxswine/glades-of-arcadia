<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arcadia — sprite lab</title>
<style>
  /* Late-90s Impressions chrome: chunky beveled panels, 2px light bevel
     top-left and dark bevel bottom-right, inverted when pressed. System
     monospace at an integer size — never scaled fractionally. */
  :root {
    --face:   #b8b0a0;
    --face-d: #8a8375;
    --lite:   #ded7c8;
    --dark:   #5c564b;
    --ink:    #2a2620;
    --panel:  #6d6558;
    --bad:    #7a1f1f;
    --ok:     #2c4a24;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: #4a463d;
    color: var(--ink);
    font: 13px/1.45 ui-monospace, "DejaVu Sans Mono", Consolas, monospace;
    image-rendering: pixelated;
  }
  .bevel   { border-top: 2px solid var(--lite); border-left: 2px solid var(--lite);
             border-bottom: 2px solid var(--dark); border-right: 2px solid var(--dark); }
  .bevel-in{ border-top: 2px solid var(--dark); border-left: 2px solid var(--dark);
             border-bottom: 2px solid var(--lite); border-right: 2px solid var(--lite); }

  header { position: sticky; top: 0; z-index: 10; background: var(--face); padding: 8px; }
  header .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 6px; }
  header .row:last-child { margin-bottom: 0; }
  h1 { font-size: 14px; margin: 0 10px 0 0; letter-spacing: 1px; text-transform: uppercase; }
  fieldset { border: 0; margin: 0; padding: 4px 8px; background: var(--face-d); display: flex;
             gap: 8px; align-items: center; }
  fieldset > b { font-weight: normal; opacity: .8; }
  button { font: inherit; background: var(--face); color: var(--ink); padding: 3px 10px; cursor: pointer;
           border-top: 2px solid var(--lite); border-left: 2px solid var(--lite);
           border-bottom: 2px solid var(--dark); border-right: 2px solid var(--dark); }
  button:active, button[aria-pressed="true"] {
           border-top: 2px solid var(--dark); border-left: 2px solid var(--dark);
           border-bottom: 2px solid var(--lite); border-right: 2px solid var(--lite);
           background: var(--face-d); }
  select, input[type=number], input[type=text] { font: inherit; background: var(--lite); color: var(--ink);
           border-top: 2px solid var(--dark); border-left: 2px solid var(--dark);
           border-bottom: 2px solid var(--lite); border-right: 2px solid var(--lite); padding: 2px 4px; }
  input[type=range] { width: 200px; }
  label { display: flex; gap: 4px; align-items: center; }

  main { padding: 10px; }
  section { margin-bottom: 14px; background: var(--panel); padding: 8px; }
  section > h2 { font-size: 13px; margin: 0 0 8px; color: var(--lite); letter-spacing: 1px;
                 text-transform: uppercase; }
  .grid { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-start; }
  .cell { background: var(--face); padding: 6px; }
  .cell .name { font-size: 11px; margin-bottom: 4px; white-space: nowrap; }
  .cell .meta { font-size: 10px; opacity: .7; }
  .shots { display: flex; gap: 6px; align-items: flex-end; }
  canvas { display: block; }
  .lint { background: var(--lite); padding: 6px 8px; max-height: 210px; overflow: auto; font-size: 12px; }
  .lint .f { color: var(--bad); }
  .lint .a { color: #6a5a10; }
  .lint .clean { color: var(--ok); }
  .note { color: var(--lite); font-size: 11px; opacity: .8; margin: 0 0 8px; }
  #status { color: var(--lite); font-size: 12px; }
</style>
</head>
<body>

<header class="bevel">
  <div class="row">
    <h1>Arcadia sprite lab</h1>
    <fieldset class="bevel-in">
      <b>seed</b>
      <input id="seed" type="range" min="0" max="255" value="42">
      <input id="seedN" type="number" min="0" max="99999" value="42" style="width:6em">
      <button id="reroll">re-roll</button>
    </fieldset>
    <fieldset class="bevel-in">
      <b>stage</b>
      <button class="stage" data-v="sprout">sprout</button>
      <button class="stage" data-v="young">young</button>
      <button class="stage" data-v="mature" aria-pressed="true">mature</button>
    </fieldset>
    <fieldset class="bevel-in">
      <b>palette</b>
      <select id="variant"></select>
    </fieldset>
  </div>
  <div class="row">
    <fieldset class="bevel-in">
      <b>zoom</b>
      <label><input type="checkbox" class="zoom" value="1" checked>1&times;</label>
      <label><input type="checkbox" class="zoom" value="4" checked>4&times;</label>
      <label><input type="checkbox" class="zoom" value="8" checked>8&times;</label>
    </fieldset>
    <fieldset class="bevel-in">
      <b>ground</b>
      <select id="ground">
        <option value="#9a958a">neutral</option>
        <option value="#74863C">grass</option>
        <option value="#C0A176">earth</option>
        <option value="#BAAF9E">marble</option>
        <option value="#27757C">water</option>
        <option value="#2a2620">night</option>
      </select>
    </fieldset>
    <fieldset class="bevel-in">
      <label><input type="checkbox" id="grid" checked> pixel grid</label>
      <label><input type="checkbox" id="anchor" checked> anchor</label>
      <label><input type="checkbox" id="bounds"> bounds</label>
    </fieldset>
    <fieldset class="bevel-in">
      <b>snap</b>
      <input id="snapPort" type="text" value="8794" style="width:5em">
      <button id="snapAll">snap all</button>
      <span id="status"></span>
    </fieldset>
  </div>
  <!-- THE ISOMETRIC OVERLAY. The row above draws the coordinate system of the
       FILE — square pixels, a rectangular bounds box. This row draws the
       coordinate system of the WORLD. A sprite can sit perfectly in the first
       and point at nothing the map contains; that blind spot hid a fault
       across a third of the art. See tools/isogeom.mjs. -->
  <div class="row">
    <fieldset class="bevel-in">
      <b>iso</b>
      <label><input type="checkbox" id="isoDiamond"> ground diamond</label>
      <label><input type="checkbox" id="isoHex"> cube hexagon</label>
      <label><input type="checkbox" id="isoGuide"> 2:1 guide</label>
      <label><input type="checkbox" id="isoBase"> base contour</label>
      <label>height <input id="isoH" type="number" min="0" max="6" step="0.5" value="1" style="width:4em"></label>
    </fieldset>
    <fieldset class="bevel-in">
      <label><input type="checkbox" id="isoOnly"> only sprites that end flat</label>
      <span id="isoCount"></span>
    </fieldset>
  </div>
</header>

<main>
  <section>
    <h2>lintSprite — whole catalogue</h2>
    <p class="note">Faults from <code>lintSprite()</code> in js/art/format.js, plus lab advisories
      (marked <i>adv</i>) that are not contract violations but usually mean something is off.</p>
    <div id="lint" class="lint bevel-in">running&hellip;</div>
  </section>
  <div id="out"></div>
</main>

<script type="module">
import { PALETTE, resolve, variant, RAMPS } from '../js/palette.js';
import { lintSprite, keysUsed, TRANSPARENT } from '../js/art/format.js';
import { CLUMPS, CLUMP_GROUPS } from '../js/art/clumps.js';
import * as GROW from '../js/art/grow.js';
import {
  groundDiamond, boxHull, baseProfile, measure, measurable, RUN_MIN,
  AUDITED_MODULES, spritesIn,
} from './isogeom.mjs';

/* ------------------------------------------------------------------ *
 * State
 * ------------------------------------------------------------------ */
const qs = new URL(location.href).searchParams;
const S = {
  seed: +(qs.get('seed') ?? 42),
  stage: qs.get('stage') || 'mature',
  variant: 'base',
  zooms: [1, 4, 8],
  ground: '#9a958a',
  grid: true,
  anchor: true,
  bounds: false,
  iso: { diamond: false, hex: false, guide: false, base: false, h: 1, only: false },
};
if (qs.get('snap')) document.getElementById('snapPort').value = qs.get('snap');

/* Palette variants — the cheap period trick: the same rows through a shifted
   ramp gives an autumn tree or a moonlit statue for free. */
const VARIANTS = {
  base: null,
  autumn: { canopy: 'terracotta', olive: 'gold' },
  scorched: { canopy: 'olive', grass: 'olive' },
  dead: { canopy: 'earth', olive: 'earth', grass: 'earth' },
  moonlit: { canopy: 'cypress', grass: 'cypress', olive: 'cypress', marble: 'sky' },
  bronze: { marble: 'gold', rock: 'gold' },
};
const vsel = document.getElementById('variant');
for (const k of Object.keys(VARIANTS)) vsel.append(new Option(k, k));

function resolver() {
  return VARIANTS[S.variant] ? variant(VARIANTS[S.variant]) : resolve;
}

/* ------------------------------------------------------------------ *
 * Discover hand-authored sprite modules.
 *
 * Seven people are building this game in parallel and I do not know what the
 * other artists will call their files. So the lab probes a list of likely
 * module paths, imports whatever exists, and walks the exports for anything
 * sprite-shaped. Adding tiles.js or creatures.js later needs no edit here.
 * ------------------------------------------------------------------ */
// The audited modules come FIRST and by name, because probing is a guess and a
// guess goes stale: `decor.js` and `extras.js` were written after this list was
// and were never on it, so forty-seven sprites — the whole fountain and column
// family among them — had never once appeared in the sprite lab. Everything
// after the spread is still speculative, and still costs nothing when absent.
const CANDIDATES = [
  ...AUDITED_MODULES,
  'sprites', 'terrain', 'ground', 'water',
  'sculpture', 'statues', 'structures', 'buildings', 'creatures', 'figures',
  'decals', 'edges', 'ui', 'icons', 'index',
];

function isSprite(v) {
  return v && typeof v === 'object' && Array.isArray(v.rows) &&
    typeof v.w === 'number' && typeof v.h === 'number' && Array.isArray(v.anchor);
}

function collectSprites(mod, modName, into) {
  const seen = new Set();
  const push = (sp, fallback) => {
    if (!isSprite(sp)) return;
    const name = sp.name || fallback;
    if (seen.has(name)) return;
    seen.add(name);
    into.push({ sprite: sp, module: modName, key: fallback });
  };
  for (const [k, v] of Object.entries(mod)) {
    if (isSprite(v)) push(v, k);
    else if (Array.isArray(v)) v.forEach((s, i) => push(s, `${k}[${i}]`));
    else if (v && typeof v === 'object' && !(v instanceof Function)) {
      for (const [k2, v2] of Object.entries(v)) push(v2, `${k}.${k2}`);
    }
  }
}

/** The raw module objects, kept so the iso census can walk EXACTLY what the
 *  headless audit walks — see `auditedItems`. */
const MODULES = new Map();

async function discover() {
  const found = [];
  await Promise.all(CANDIDATES.map(async (n) => {
    try {
      const mod = await import(`../js/art/${n}.js`);
      MODULES.set(n, mod);
      collectSprites(mod, n, found);
    } catch { /* not written yet, or not mine to know about */ }
  }));
  return found;
}

/* ------------------------------------------------------------------ *
 * Drawing
 *
 * Two coordinate systems meet in here and it is worth being explicit about
 * which is which, because confusing them is the whole subject of the iso
 * overlay:
 *
 *   FILE space   sprite pixel (x, y), origin at the sprite's top-left. The
 *                pixel grid and the bounds box live here.
 *   WORLD space  offsets in screen pixels from the ANCHOR, which is the pixel
 *                that lands on the footprint's centre point. The ground
 *                diamond, the cube hexagon and the 2:1 guide live here.
 *
 * The canvas is laid out in file space, with `left`/`top` allowed to go
 * NEGATIVE so that world-space geometry wider than the sprite (a 1x1 diamond
 * is 64px across; an obelisk is 24) still fits on the tile.
 * ------------------------------------------------------------------ */

/** How much room the world-space overlay needs, in sprite pixels. */
function isoExtents(sp) {
  const fp = sp.footprint || [1, 1];
  const pts = [...groundDiamond(fp[0], fp[1]), ...boxHull(fp[0], fp[1], S.iso.h)];
  let minX = 0;
  let minY = 0;
  let maxX = sp.w;
  let maxY = sp.h;
  for (const p of pts) {
    minX = Math.min(minX, sp.anchor[0] + p.x);
    maxX = Math.max(maxX, sp.anchor[0] + p.x);
    minY = Math.min(minY, sp.anchor[1] + p.y);
    maxY = Math.max(maxY, sp.anchor[1] + p.y);
  }
  return { minX, minY, maxX, maxY };
}

function isoOn() {
  return S.iso.diamond || S.iso.hex || S.iso.guide;
}

/**
 * The overlay. Drawn UNDER the sprite (guide, hexagon, far half of the
 * diamond) and OVER it (near half of the diamond, base contour), because the
 * two edges the base has to meet are the two nearest the viewer and a guide
 * you cannot see against the art is not a guide.
 */
function drawIsoUnder(ctx, sp, scale, ox, oy) {
  const fp = sp.footprint || [1, 1];
  const P = (p) => ({ x: ox + p.x * scale, y: oy + p.y * scale });
  const poly = (pts, style, width) => {
    ctx.beginPath();
    pts.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
    ctx.closePath();
    ctx.strokeStyle = style;
    ctx.lineWidth = width;
    ctx.stroke();
  };

  // The 2:1 lattice. Every line here is one a sprite is ALLOWED to draw along:
  // rising 1-in-2, falling 1-in-2, vertical. There is deliberately no
  // horizontal in it — that is the point of the picture.
  if (S.iso.guide) {
    const step = 8 * scale;
    const w = ctx.canvas.width;
    const h = ctx.canvas.height;
    ctx.save();
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(255,255,255,0.12)';
    ctx.beginPath();
    // Slope +1/2 and -1/2, both phased through the anchor so the lattice is
    // the ground plane's own and not an arbitrary sheet of graph paper.
    //
    //   y = sign*x + c,  so a line is identified by its intercept c, and the
    //   one through the anchor is c0. A line is visible somewhere on the
    //   canvas if c lands anywhere in [-|sign|*w, h] — widened by a step at
    //   each end rather than solved exactly, because being one line generous
    //   costs nothing and being one line short leaves a visible gap.
    for (const sign of [0.5, -0.5]) {
      const c0 = oy - sign * ox;
      const lo = Math.floor((-Math.abs(sign) * w - step - c0) / step);
      const hi = Math.ceil((h + Math.abs(sign) * w + step - c0) / step);
      for (let k = lo; k <= hi; k++) {
        const c = c0 + k * step;
        ctx.moveTo(0, Math.round(c) + 0.5);
        ctx.lineTo(w, Math.round(c + sign * w) + 0.5);
      }
    }
    for (let x = ox % step; x < w; x += step) {
      ctx.moveTo(Math.round(x) + 0.5, 0);
      ctx.lineTo(Math.round(x) + 0.5, h);
    }
    ctx.stroke();
    ctx.restore();
  }

  // The cube hexagon: the silhouette of a box standing on this footprint,
  // `height` tiles tall. Art should live inside it and use its edges.
  if (S.iso.hex && S.iso.h > 0) {
    poly(boxHull(fp[0], fp[1], S.iso.h).map(P), 'rgba(255,206,110,0.55)', 1);
  }

  // The FAR half of the ground diamond, dim: it is behind the object.
  if (S.iso.diamond) {
    const [n, e, s, w] = groundDiamond(fp[0], fp[1]).map(P);
    ctx.beginPath();
    ctx.moveTo(w.x, w.y);
    ctx.lineTo(n.x, n.y);
    ctx.lineTo(e.x, e.y);
    ctx.strokeStyle = 'rgba(120,220,255,0.35)';
    ctx.lineWidth = 1;
    ctx.stroke();
    void s;
  }
}

function drawIsoOver(ctx, sp, scale, ox, oy) {
  const fp = sp.footprint || [1, 1];
  const P = (p) => ({ x: ox + p.x * scale, y: oy + p.y * scale });

  // The NEAR edges of the ground diamond, bright: W -> S -> E. THIS IS THE
  // SHAPE THE BASE HAS TO MEET. A foot may sit inside it — a narrow post
  // occupies only the middle of its plot, quite correctly. What it may not do
  // is run flat across it.
  if (S.iso.diamond) {
    const [, e, s, w] = groundDiamond(fp[0], fp[1]).map(P);
    ctx.beginPath();
    ctx.moveTo(w.x, w.y);
    ctx.lineTo(s.x, s.y);
    ctx.lineTo(e.x, e.y);
    ctx.strokeStyle = 'rgba(120,220,255,0.95)';
    ctx.lineWidth = Math.max(1, scale / 4);
    ctx.stroke();
  }

  // The measured bottom contour, painted on. Green where it steps, RED where
  // it runs dead level for RUN_MIN columns or more AT GROUND LEVEL. This is
  // `iso-audit` drawn onto the sprite instead of printed: the number says a
  // sprite is wrong, the contour says which twenty pixels.
  if (S.iso.base) {
    const bad = new Set();
    for (const run of measure(sp).runs) for (let x = run.x0; x <= run.x1; x++) bad.add(x);
    for (const p of baseProfile(sp)) {
      ctx.fillStyle = bad.has(p.x) ? 'rgba(255,64,64,0.92)' : 'rgba(126,224,129,0.85)';
      ctx.fillRect(
        ox + (p.x - sp.anchor[0]) * scale,
        oy + (p.y - sp.anchor[1] + 1) * scale,
        scale,
        Math.max(1, Math.round(scale / 2))
      );
    }
  }
}

function drawSprite(sp, scale, opts = {}) {
  const res = opts.resolve || resolver();
  const pad = 2;
  // `wide` is about ROOM, not about ink: only the diamond, the hexagon and the
  // guide can fall outside the sprite's own box. The base contour is measured
  // from the art and never leaves it, so ticking it alone must not reflow every
  // cell in the page.
  const wide = opts.iso ?? isoOn();
  const ext = wide ? isoExtents(sp) : { minX: 0, minY: 0, maxX: sp.w, maxY: sp.h };
  const left = Math.floor(ext.minX) - pad;
  const top = Math.floor(ext.minY) - pad;
  const right = Math.ceil(ext.maxX) + pad;
  const bottom = Math.ceil(ext.maxY) + pad;

  const cv = document.createElement('canvas');
  cv.width = (right - left) * scale;
  cv.height = (bottom - top) * scale;
  const ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  // Sprite pixel -> canvas pixel, and the world-space origin (the top-left of
  // the anchor pixel, which is exactly where render.js lands it).
  const px = (x) => (x - left) * scale;
  const py = (y) => (y - top) * scale;
  const ox = px(sp.anchor[0]);
  const oy = py(sp.anchor[1]);

  ctx.fillStyle = opts.ground || S.ground;
  ctx.fillRect(0, 0, cv.width, cv.height);

  // Pixel grid, only where a pixel is big enough for it to mean anything.
  if (S.grid && scale >= 4) {
    ctx.fillStyle = 'rgba(0,0,0,0.16)';
    for (let x = left; x <= right; x++) ctx.fillRect(px(x), 0, 1, cv.height);
    for (let y = top; y <= bottom; y++) ctx.fillRect(0, py(y), cv.width, 1);
  }

  if (wide) drawIsoUnder(ctx, sp, scale, ox, oy);

  for (let y = 0; y < sp.h; y++) {
    const row = sp.rows[y];
    for (let x = 0; x < sp.w; x++) {
      const ch = row[x];
      if (ch === TRANSPARENT) continue;
      const hex = res(ch);
      // Magenta is deliberate: an unknown palette key must be impossible to
      // miss, not silently transparent.
      ctx.fillStyle = hex || '#ff00ff';
      ctx.fillRect(px(x), py(y), scale, scale);
    }
  }

  if (wide || S.iso.base) drawIsoOver(ctx, sp, scale, ox, oy);

  if (S.bounds) {
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 1;
    ctx.strokeRect(px(0) + 0.5, py(0) + 0.5, sp.w * scale - 1, sp.h * scale - 1);
  }
  if (S.anchor) {
    const t = Math.max(1, Math.round(scale / 4));
    const arm = Math.max(2, scale * 1.5);
    ctx.fillStyle = '#C8414A';
    ctx.fillRect(ox - arm, oy + (scale - t) / 2, arm * 2 + scale, t);
    ctx.fillRect(ox + (scale - t) / 2, oy - arm, t, arm * 2 + scale);
  }
  return cv;
}

/** Does this sprite end in a horizontal edge? Null when it is too small to ask. */
function liftOf(sp) {
  return measurable(sp) ? measure(sp) : null;
}

/**
 * The audited population — the same modules `iso-audit` walks, flattened by
 * the same function. Not `DISCOVERED.filter(...)`: the lab's own collector
 * dedups by NAME and the audit's by identity, and a census that differs from
 * the terminal's by two sprites is a census nobody trusts. This is the whole
 * reason `spritesIn` lives in isogeom.mjs and not in either consumer.
 */
function auditedItems() {
  const out = [];
  for (const n of AUDITED_MODULES) {
    const mod = MODULES.get(n);
    if (mod) out.push(...spritesIn(mod, `${n}.js`));
  }
  return out;
}

function cell(sp, subtitle) {
  const d = document.createElement('div');
  d.className = 'cell bevel';
  const n = document.createElement('div');
  n.className = 'name';
  n.textContent = sp.name || '(unnamed)';
  const m = document.createElement('div');
  m.className = 'meta';
  m.textContent = `${sp.w}×${sp.h}  anchor ${sp.anchor[0]},${sp.anchor[1]}` +
    (subtitle ? `  ${subtitle}` : '');
  const shots = document.createElement('div');
  shots.className = 'shots';
  for (const z of S.zooms) shots.append(drawSprite(sp, z));
  d.append(n, shots, m);

  // The one number from iso-audit, on the sprite it belongs to. Only shown
  // once the overlay is up: a permanent red badge on a third of the catalogue
  // would become wallpaper, and a warning nobody reads is worse than none.
  const q = liftOf(sp);
  if (q && (isoOn() || S.iso.base)) {
    const b = document.createElement('div');
    b.className = 'meta';
    b.style.color = q.ok ? 'var(--ok)' : 'var(--bad)';
    b.textContent = q.ok
      ? `ground edge clean  (no level run >= ${RUN_MIN}px)`
      : `FLAT AT GROUND: ${q.flat}px level  (${(q.over * 100) | 0}% of its diamond)`;
    d.append(b);
  }
  return d;
}

function section(title, sprites, sub, audited = false) {
  // The "only flat" filter is a view of the AUDITED population and nothing
  // else. Composed trees are excluded from the measure on purpose (a wide
  // canopy over a narrow trunk passes trivially — see isogeom), so showing a
  // filtered slice of them would put a number on art the number cannot judge.
  if (S.iso.only && !audited) return null;
  const items = S.iso.only
    ? sprites.filter((i) => {
        const q = liftOf(i.sprite || i);
        return q && !q.ok;
      })
    : sprites;
  if (S.iso.only && !items.length) return null;
  const s = document.createElement('section');
  const h = document.createElement('h2');
  h.textContent = `${title}  (${items.length}${S.iso.only ? ` of ${sprites.length}` : ''})`;
  const g = document.createElement('div');
  g.className = 'grid';
  for (const item of items) {
    const sp = item.sprite || item;
    g.append(cell(sp, item.note || (sub ? sub(item) : '')));
  }
  s.append(h, g);
  return s;
}

/* ------------------------------------------------------------------ *
 * What to show
 * ------------------------------------------------------------------ */
function composerSpecs() {
  const out = [];
  for (const [name, info] of Object.entries(GROW.COMPOSER_INFO)) {
    for (const v of info.variants) {
      const params = info.key ? { [info.key]: v } : {};
      out.push({ composer: name, variant: v, params });
    }
  }
  return out;
}

function buildComposed(seedOffset = 0) {
  const out = [];
  for (const spec of composerSpecs()) {
    let sp;
    try {
      sp = GROW.compose(spec.composer, (S.seed + seedOffset) >>> 0, { ...spec.params, stage: S.stage });
    } catch (err) {
      console.error(spec, err);
      continue;
    }
    out.push({ sprite: sp, note: `${spec.composer}/${spec.variant}`, group: spec.composer });
  }
  return out;
}

let DISCOVERED = [];

function render() {
  const out = document.getElementById('out');
  out.textContent = '';
  // `section` returns null when the "only flat" filter empties it, and
  // append(null) would print the word "null" onto the page.
  const add = (sec) => { if (sec) out.append(sec); };

  // Composers, grouped, with three seeds each so variety is visible at a
  // glance — one sample of a seeded generator tells you almost nothing.
  const byComposer = new Map();
  for (const off of [0, 101, 707]) {
    for (const item of buildComposed(off)) {
      if (!byComposer.has(item.group)) byComposer.set(item.group, []);
      byComposer.get(item.group).push(item);
    }
  }
  for (const [name, items] of byComposer) {
    items.sort((a, b) => a.note.localeCompare(b.note));
    add(section(`composer: ${name}`, items));
  }

  // Clumps, in their authored groups.
  for (const [group, names] of Object.entries(CLUMP_GROUPS)) {
    add(section(`clumps: ${group}`, names.map((n) => ({ sprite: CLUMPS[n] })), null, true));
  }

  // Whatever the other artists have written.
  const byModule = new Map();
  for (const item of DISCOVERED) {
    if (item.module === 'clumps') continue; // already shown above
    if (!byModule.has(item.module)) byModule.set(item.module, []);
    byModule.get(item.module).push(item);
  }
  for (const [mod, items] of byModule) {
    add(section(`sprites: ${mod}.js`, items, null, AUDITED_MODULES.includes(mod)));
  }
  if (!byModule.size) {
    const s = document.createElement('section');
    s.innerHTML = '<h2>hand-authored sprites</h2><p class="note">No sprite modules found yet under ' +
      'js/art/. The lab probes for them on every load — write one and it appears here with no edit ' +
      'to this file.</p>';
    out.append(s);
  }

  isoTally();
  runLint();
}

/**
 * The census, in the header, next to the filter that acts on it. The number
 * lives here as well as in `iso-audit` because a count you have to leave the
 * page to read is a count nobody checks between edits.
 */
function isoTally() {
  const all = auditedItems().map((d) => d.sprite).filter(measurable);
  const bad = all.filter((s) => !measure(s).ok).length;
  const el = document.getElementById('isoCount');
  el.textContent = `${bad} of ${all.length} flat at ground · ${AUDITED_MODULES.join(' ')}`;
  el.style.color = bad ? '#7a1f1f' : 'var(--ok)';
}

/* ------------------------------------------------------------------ *
 * Lint
 * ------------------------------------------------------------------ */
function advisories(sp) {
  const out = [];
  const w = sp.w, h = sp.h;
  if (sp.rows.length !== h) out.push('rows.length does not match h');
  for (let y = 0; y < h; y++) {
    if (sp.rows[y].length !== w) { out.push(`row ${y} is ${sp.rows[y].length}px, expected ${w}`); break; }
  }
  if (sp.anchor[0] < 0 || sp.anchor[0] >= w || sp.anchor[1] < 0 || sp.anchor[1] >= h) {
    out.push(`anchor ${sp.anchor} outside ${w}×${h}`);
  }
  // Stray single pixels: they dissolve at 1x and shimmer when the camera pans.
  let strays = 0, filled = 0;
  const at = (x, y) => (x < 0 || y < 0 || x >= w || y >= h ? TRANSPARENT : sp.rows[y][x]);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    if (sp.rows[y][x] === TRANSPARENT) continue;
    filled++;
    let n = 0;
    if (at(x - 1, y) !== TRANSPARENT) n++;
    if (at(x + 1, y) !== TRANSPARENT) n++;
    if (at(x, y - 1) !== TRANSPARENT) n++;
    if (at(x, y + 1) !== TRANSPARENT) n++;
    if (n === 0) strays++;
  }
  if (strays) out.push(`${strays} isolated pixel${strays > 1 ? 's' : ''} (fuzzy edge)`);
  if (!filled) out.push('sprite is entirely transparent');
  // Value structure: the "green blob" test. Foliage with fewer than three
  // distinct values in its own ramp has no internal structure.
  const keys = keysUsed(sp);
  const canopyKeys = keys.filter((k) => 'abcde'.includes(k));
  if (canopyKeys.length && canopyKeys.length < 3 && filled > 120) {
    out.push(`only ${canopyKeys.length} canopy value(s) over ${filled}px — "green blob"?`);
  }
  return out;
}

function runLint() {
  const box = document.getElementById('lint');
  box.textContent = '';
  const all = [
    ...Object.values(CLUMPS).map((s) => ({ sprite: s, where: 'clumps.js' })),
    ...buildComposed(0).map((i) => ({ sprite: i.sprite, where: 'grow.js' })),
    ...buildComposed(101).map((i) => ({ sprite: i.sprite, where: 'grow.js' })),
    ...DISCOVERED.filter((d) => d.module !== 'clumps').map((d) => ({ sprite: d.sprite, where: d.module + '.js' })),
  ];
  let faults = 0, advs = 0;
  const frag = document.createDocumentFragment();
  for (const { sprite, where } of all) {
    for (const p of lintSprite(sprite, PALETTE)) {
      const d = document.createElement('div');
      d.className = 'f';
      d.textContent = `FAULT  ${where}  ${p}`;
      frag.append(d); faults++;
    }
    for (const p of advisories(sprite)) {
      const d = document.createElement('div');
      d.className = 'a';
      d.textContent = `adv    ${where}  ${sprite.name}: ${p}`;
      frag.append(d); advs++;
    }
  }
  const head = document.createElement('div');
  head.className = faults ? 'f' : 'clean';
  head.textContent = `${all.length} sprites checked — ${faults} fault(s), ${advs} advisory(ies)`;
  box.append(head, frag);
}

/* ------------------------------------------------------------------ *
 * Contact sheets — POST to tools/snap.mjs so the art can be looked at.
 * ------------------------------------------------------------------ */
function sheet(items, cols, scale, label) {
  const pad = 4;
  let cw = 0, ch = 0;
  for (const sp of items) { cw = Math.max(cw, sp.w); ch = Math.max(ch, sp.h); }
  const CW = (cw + pad * 2) * scale;
  const CH = (ch + pad * 2) * scale + 10;
  const rows = Math.ceil(items.length / cols);
  const cv = document.createElement('canvas');
  cv.width = cols * CW;
  cv.height = rows * CH;
  const ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = S.ground;
  ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  for (let c = 1; c < cols; c++) ctx.fillRect(c * CW, 0, 1, cv.height);
  for (let r = 1; r < rows; r++) ctx.fillRect(0, r * CH, cv.width, 1);
  const res = resolver();
  items.forEach((sp, i) => {
    const c = i % cols, r = (i / cols) | 0;
    // Sit every sprite's anchor on the same baseline, which is how they will
    // actually meet the tile — floating each one in its own box hides exactly
    // the anchor bugs this sheet exists to catch.
    const ax = c * CW + CW / 2;
    const ay = r * CH + CH - 8 * scale;
    for (let y = 0; y < sp.h; y++) for (let x = 0; x < sp.w; x++) {
      const chr = sp.rows[y][x];
      if (chr === TRANSPARENT) continue;
      ctx.fillStyle = res(chr) || '#ff00ff';
      ctx.fillRect(ax + (x - sp.anchor[0]) * scale, ay + (y - sp.anchor[1]) * scale, scale, scale);
    }
    ctx.fillStyle = '#C8414A';
    ctx.fillRect(ax - 1, ay - 1, 2, 2);
  });
  return cv;
}

function post(cv, name) {
  const port = document.getElementById('snapPort').value.trim();
  return new Promise((done) => cv.toBlob(async (b) => {
    try {
      await fetch(`http://localhost:${port}/snap?name=${encodeURIComponent(name)}`, { method: 'POST', body: b });
      done(true);
    } catch { done(false); }
  }));
}

/**
 * The ISO contact sheet: every sprite that ends flat, at 4x, each with the
 * ground diamond it failed to meet and its own bottom contour painted on.
 *
 * This exists because the fault was found BY EYE, by the owner, and the fix
 * has to be checkable the same way. `iso-audit` prints thirty-two names; this
 * shows thirty-two pictures of what is wrong with them, and `snap.mjs` puts
 * them on disk where an agent with no screen can open them.
 */
function isoSheet(sprites, cols, scale) {
  const shots = sprites.map((sp) => ({ sp, cv: drawSprite(sp, scale, { iso: true, ground: '#3b3830' }) }));
  const CW = Math.max(...shots.map((s) => s.cv.width)) + 8;
  const CH = Math.max(...shots.map((s) => s.cv.height)) + 22;
  const rows = Math.ceil(shots.length / cols);
  const cv = document.createElement('canvas');
  cv.width = cols * CW;
  cv.height = rows * CH;
  const ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#2a2620';
  ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.font = '12px ui-monospace, Consolas, monospace';
  ctx.textBaseline = 'top';
  shots.forEach((s, i) => {
    const c = i % cols;
    const r = (i / cols) | 0;
    const x = c * CW + 4;
    const y = r * CH + 18;
    const q = measure(s.sp);
    ctx.fillStyle = q.ok ? '#7ee081' : '#ff6b6b';
    ctx.fillText(`${s.sp.name}  ${q.flat}px level`, x, r * CH + 3);
    ctx.drawImage(s.cv, x, y);
  });
  return cv;
}

async function snapAll() {
  const st = document.getElementById('status');
  st.textContent = 'snapping…';
  const trees = [], plants = [];
  for (const off of [0, 101, 707, 1313]) {
    for (const item of buildComposed(off)) {
      (['broadleaf', 'conifer', 'olive', 'willow'].includes(item.group) ? trees : plants).push(item.sprite);
    }
  }
  const jobs = [
    [sheet(trees, 8, 3, 'trees'), 'lab-trees'],
    [sheet(plants, 8, 4, 'plants'), 'lab-plants'],
    [sheet(Object.values(CLUMPS), 9, 8, 'clumps'), 'lab-clumps'],
  ];
  const hand = DISCOVERED.filter((d) => d.module !== 'clumps').map((d) => d.sprite);
  if (hand.length) jobs.push([sheet(hand, 8, 4, 'sprites'), 'lab-sprites']);

  // The offenders, in pages of twelve — one 32-up sheet at 4x is 6000px wide
  // and stops getting bigger on screen, which is the ceiling poseshot ran into.
  const flat = auditedItems()
    .map((d) => d.sprite)
    .filter((s) => measurable(s) && !measure(s).ok)
    .sort((a, b) => measure(b).over - measure(a).over);
  const was = { ...S.iso };
  S.iso = { diamond: true, hex: false, guide: false, base: true, h: 1, only: false };
  for (let i = 0; i < flat.length; i += 12) {
    jobs.push([isoSheet(flat.slice(i, i + 12), 4, 4), `lab-iso-${String(i / 12 + 1).padStart(2, '0')}`]);
  }
  S.iso = was;

  let ok = 0;
  for (const [cv, name] of jobs) if (await post(cv, name)) ok++;
  st.textContent = ok === jobs.length ? `snapped ${ok} sheet(s)` : `snapped ${ok}/${jobs.length} — is snap.mjs running?`;
}

/* ------------------------------------------------------------------ *
 * Wiring
 * ------------------------------------------------------------------ */
const $ = (id) => document.getElementById(id);
$('seed').addEventListener('input', (e) => { S.seed = +e.target.value; $('seedN').value = S.seed; render(); });
$('seedN').addEventListener('change', (e) => { S.seed = +e.target.value || 0; $('seed').value = S.seed % 256; render(); });
$('reroll').addEventListener('click', () => {
  S.seed = (Math.random() * 4096) | 0; $('seedN').value = S.seed; $('seed').value = S.seed % 256; render();
});
for (const b of document.querySelectorAll('.stage')) {
  b.addEventListener('click', () => {
    S.stage = b.dataset.v;
    for (const o of document.querySelectorAll('.stage')) o.setAttribute('aria-pressed', String(o === b));
    render();
  });
}
$('variant').addEventListener('change', (e) => { S.variant = e.target.value; render(); });
$('ground').addEventListener('change', (e) => { S.ground = e.target.value; render(); });
for (const c of document.querySelectorAll('.zoom')) {
  c.addEventListener('change', () => {
    S.zooms = [...document.querySelectorAll('.zoom')].filter((z) => z.checked).map((z) => +z.value);
    render();
  });
}
$('grid').addEventListener('change', (e) => { S.grid = e.target.checked; render(); });
$('anchor').addEventListener('change', (e) => { S.anchor = e.target.checked; render(); });
$('bounds').addEventListener('change', (e) => { S.bounds = e.target.checked; render(); });
$('snapAll').addEventListener('click', snapAll);

for (const [id, key] of [
  ['isoDiamond', 'diamond'], ['isoHex', 'hex'], ['isoGuide', 'guide'],
  ['isoBase', 'base'], ['isoOnly', 'only'],
]) {
  $(id).addEventListener('change', (e) => { S.iso[key] = e.target.checked; render(); });
}
$('isoH').addEventListener('change', (e) => { S.iso.h = Math.max(0, +e.target.value || 0); render(); });

// ?iso=diamond,hex,guide,base,only — so a snap run can ask for the overlay
// without a human ticking four boxes, and so a URL can be pasted into a bug
// report and show the same picture.
if (qs.get('iso') !== null) {
  const want = new Set((qs.get('iso') || 'diamond,base').split(',').filter(Boolean));
  for (const [id, key] of [
    ['isoDiamond', 'diamond'], ['isoHex', 'hex'], ['isoGuide', 'guide'],
    ['isoBase', 'base'], ['isoOnly', 'only'],
  ]) {
    S.iso[key] = want.has(key);
    $(id).checked = S.iso[key];
  }
  if (qs.get('isoH')) { S.iso.h = +qs.get('isoH') || 1; $('isoH').value = S.iso.h; }
}

// Number keys jump between stages; everything reachable from the keyboard.
addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  const map = { 1: 'sprout', 2: 'young', 3: 'mature' };
  if (map[e.key]) document.querySelector(`.stage[data-v="${map[e.key]}"]`).click();
  if (e.key === 'r') $('reroll').click();
  if (e.key === 's') snapAll();
});

DISCOVERED = await discover();
render();
if (qs.get('autosnap') !== null) await snapAll();
window.__lab = { S, render, snapAll, GROW, CLUMPS };
</script>
</body>
</html>
