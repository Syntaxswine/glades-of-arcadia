<!doctype html>
<meta charset="utf-8">
<title>arcadia — procedural plant lab</title>
<style>
  body { background:#2A2620; color:#DDD2BE; font:11px monospace; margin:0; padding:8px; }
  canvas { image-rendering: pixelated; display:block; margin:4px 0 14px; }
  h2 { font-size:11px; margin:8px 0 2px; color:#93887A; }
  #err { color:#C8414A; white-space:pre-wrap; }
</style>
<div id="err"></div>
<div id="out"></div>
<script type="module">
const err = document.getElementById('err');
const out = document.getElementById('out');
window.LAB_ERR = '';
let G, pal, fmt, T;
try {
  G   = await import('/js/art/grow.js');
  pal = await import('/js/palette.js');
  fmt = await import('/js/art/format.js');
  T   = await import('/js/art/tiles.js');
} catch (e) {
  window.LAB_ERR = String(e && e.stack || e);
  err.textContent = window.LAB_ERR;
  throw e;
}

const CAN = {};
function section(title, w, h, scale, bg) {
  const hh = document.createElement('h2'); hh.textContent = title; out.appendChild(hh);
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  cv.style.width = (w*scale)+'px'; cv.style.height = (h*scale)+'px';
  const ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  if (bg) { ctx.fillStyle = bg; ctx.fillRect(0,0,w,h); }
  out.appendChild(cv); CAN[title] = cv;
  return ctx;
}

function blit(ctx, sprite, dx, dy, resolve) {
  const r = resolve || pal.resolve;
  const img = ctx.createImageData(sprite.w, sprite.h);
  const d = img.data;
  for (let y = 0; y < sprite.h; y++) {
    const row = sprite.rows[y];
    for (let x = 0; x < sprite.w; x++) {
      const ch = row[x];
      if (ch === '.') continue;
      const hex = r(ch); if (!hex) continue;
      const i = (y*sprite.w+x)*4;
      d[i]=parseInt(hex.slice(1,3),16); d[i+1]=parseInt(hex.slice(3,5),16);
      d[i+2]=parseInt(hex.slice(5,7),16); d[i+3]=255;
    }
  }
  const tmp = document.createElement('canvas');
  tmp.width = sprite.w; tmp.height = sprite.h;
  tmp.getContext('2d').putImageData(img, 0, 0);
  ctx.drawImage(tmp, Math.round(dx), Math.round(dy));
}

const iso = (tx, ty, ox, oy) => [ (tx-ty)*32 + ox, (tx+ty)*16 + oy ];

// One tile of real turf under the anchor, so every plant is judged against the
// ground it will actually stand on rather than against a flat swatch.
let gseq = 0;
function ground(ctx, ax, ay, species='meadow') {
  gseq++;
  blit(ctx, T.grassTile(species, gseq % 7, (gseq*3) % 5), ax-32, ay-16);
}

function make(name, seed, stage, params) {
  return G.compose(name, seed, { ...(params||{}), stage });
}

window.LAB = {
  names: () => Object.keys(G.COMPOSERS),
  // A row per plant: mature x3 seeds, then young, then sprout, all on turf.
  strip(list, opts = {}) {
    const scale = opts.scale || 3;
    const seeds = opts.seeds || [0x1c04, 0x51a3, 0x7e11];
    const cellW = opts.cellW || 72, cellH = opts.cellH || 84;
    const cols = seeds.length + 2;
    const W = cols*cellW + 8, H = list.length*cellH + 8;
    const title = opts.title || ('strip-' + list.join('-')).slice(0, 60);
    const ctx = section(title, W, H, scale, '#2A2620');
    list.forEach((name, r) => {
      const cy = 8 + r*cellH;
      const jobs = seeds.map(s => [s, 'mature']).concat([[seeds[0], 'young'], [seeds[0], 'sprout']]);
      jobs.forEach(([s, stage], c) => {
        const cx = 4 + c*cellW;
        const ax = Math.round(cx + cellW/2), ay = cy + cellH - 12;
        ground(ctx, ax, ay);
        let sp = null;
        try { sp = make(name, s, stage, opts.params && opts.params[name]); }
        catch (e) { window.LAB_ERR += `\n${name}/${stage}: ${e.message}`; return; }
        blit(ctx, sp, ax - sp.anchor[0], ay - sp.anchor[1]);
      });
    });
    return title;
  },
  // 1x reality check: the row of plants at true game size on real turf.
  real(list, opts = {}) {
    const seeds = opts.seeds || [0x1c04, 0x51a3];
    const per = opts.per || 2;
    const W = list.length*seeds.length*40 + 40, H = 110;
    const title = opts.title || 'real';
    const ctx = section(title, W, H, 1, '#3B4A22');
    for (let ty = 0; ty < 6; ty++) for (let tx = 0; tx < 6; tx++) {
      const [sx, sy] = iso(tx, ty, 40, 10);
      blit(ctx, T.grassTile('meadow', tx, ty), sx-32, sy-16);
    }
    let i = 0;
    for (const name of list) for (const s of seeds) {
      const sp = make(name, s, 'mature', opts.params && opts.params[name]);
      const ax = 24 + i*40, ay = 90;
      blit(ctx, sp, ax - sp.anchor[0], ay - sp.anchor[1]);
      i++;
    }
    return title;
  },
  // Raw clump stamps at 1x on a neutral field — shape review, no shading.
  async clumps(names, opts = {}) {
    const C = (await import('/js/art/clumps.js')).CLUMPS;
    const cell = opts.cell || 22;
    const cols = opts.cols || 8;
    const rows = Math.ceil(names.length/cols);
    const title = opts.title || 'clumps';
    const ctx = section(title, cols*cell+4, rows*cell+4, opts.scale || 6, '#55672D');
    names.forEach((n, i) => {
      const s = C[n]; if (!s) return;
      const x = 2 + (i%cols)*cell + Math.round((cell - s.w)/2);
      const y = 2 + Math.floor(i/cols)*cell + Math.round((cell - s.h)/2);
      blit(ctx, s, x, y);
    });
    return title;
  },
  // THE REAL TEST: every plant on a real lawn, at 1x, anchored the way the
  // renderer anchors it (SPEC §2 — anchor on the FOOTPRINT centre).
  garden(list, opts = {}) {
    const N = opts.N || 9;
    const W = N*64+64, H = N*32+140;
    const title = opts.title || 'garden';
    const ctx = section(title, W, H, opts.scale || 2, '#2A2620');
    const ox = W/2, oy = 90;
    for (let ty = 0; ty < N; ty++) for (let tx = 0; tx < N; tx++) {
      const [sx, sy] = iso(tx, ty, ox, oy);
      blit(ctx, T.grassTile(opts.species || 'meadow', tx, ty), sx-32, sy-16);
    }
    const items = [];
    let i = 0;
    for (const name of list) {
      const tx = 1 + (i % Math.floor((N-1)/2))*2, ty = 1 + Math.floor(i / Math.floor((N-1)/2))*2;
      const sp = make(name, 0x1c04 + i*977, 'mature');
      const fp = sp.footprint || [1,1];
      items.push({ tx, ty, sp, fp, key: tx+ty+(fp[0]+fp[1])/2 });
      i++;
    }
    items.sort((a,b)=>a.key-b.key || a.tx-b.tx);
    for (const it of items) {
      // footprint centre, exactly like js/iso.js footprintCentreAt
      const cx = it.tx + it.fp[0]/2 - 0.5, cy = it.ty + it.fp[1]/2 - 0.5;
      const [sx, sy] = iso(cx, cy, ox, oy);
      blit(ctx, it.sp, sx - it.sp.anchor[0], sy - it.sp.anchor[1]);
    }
    return title;
  },
  lint(list) {
    const bad = [];
    for (const name of list) for (const stage of ['sprout','young','mature']) {
      try {
        const sp = G.compose(name, 4242, { stage });
        for (const p of fmt.lintSprite(sp, pal.PALETTE)) bad.push(`${name}/${stage}: ${p}`);
      } catch (e) { bad.push(`${name}/${stage} threw ${e.message}`); }
    }
    return bad;
  },
  sizes(list) {
    return list.map(n => {
      const s = ['sprout','young','mature'].map(st => G.compose(n, 77, { stage: st }));
      return n + ' ' + s.map(x => `${x.w}x${x.h}`).join(' ');
    });
  },
  clear() { out.innerHTML=''; for (const k in CAN) delete CAN[k]; },
  async snap(title, name, zoom = 1) {
    let cv = CAN[title]; if (!cv) return 'no canvas ' + title;
    if (zoom > 1) {
      const big = document.createElement('canvas');
      big.width = cv.width*zoom; big.height = cv.height*zoom;
      const b = big.getContext('2d'); b.imageSmoothingEnabled = false;
      b.drawImage(cv, 0, 0, big.width, big.height);
      cv = big;
    }
    const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
    const res = await fetch('http://localhost:8862/snap?name='+encodeURIComponent(name||title), { method:'POST', body: blob });
    return res.text();
  },
};
window.LAB_READY = true;
</script>
