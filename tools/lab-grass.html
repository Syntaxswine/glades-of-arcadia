<!doctype html>
<meta charset="utf-8">
<title>arcadia — grass / cliff / waterfall lab</title>
<style>
  body { background:#2A2620; color:#DDD2BE; font:11px monospace; margin:0; padding:8px; }
  canvas { image-rendering: pixelated; display:block; margin:4px 0 14px; }
  h2 { font-size:11px; margin:8px 0 2px; color:#93887A; }
  #err { color:#C8414A; white-space:pre-wrap; }
</style>
<div id="err"></div>
<div id="out"></div>
<script type="module">
const err = document.getElementById('err');
const out = document.getElementById('out');
window.LAB_ERR = '';
try {
  var T = await import('/js/art/tiles.js');
  var pal = await import('/js/palette.js');
  var fmt = await import('/js/art/format.js');
  var trees = null;
  try { trees = await import('/js/art/grow.js'); } catch (e) {}
} catch (e) {
  window.LAB_ERR = String(e && e.stack || e);
  err.textContent = window.LAB_ERR;
  throw e;
}

const CAN = {};
function section(title, w, h, scale, bg) {
  const hh = document.createElement('h2'); hh.textContent = title; out.appendChild(hh);
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  cv.style.width = (w*scale)+'px'; cv.style.height = (h*scale)+'px';
  const ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  if (bg) { ctx.fillStyle = bg; ctx.fillRect(0,0,w,h); }
  out.appendChild(cv); CAN[title] = cv;
  return ctx;
}

function blit(ctx, sprite, dx, dy, resolve) {
  const r = resolve || pal.resolve;
  const img = ctx.createImageData(sprite.w, sprite.h);
  const d = img.data;
  for (let y = 0; y < sprite.h; y++) {
    const row = sprite.rows[y];
    for (let x = 0; x < sprite.w; x++) {
      const ch = row[x];
      if (ch === '.') continue;
      const hex = r(ch); if (!hex) continue;
      const i = (y*sprite.w+x)*4;
      d[i]=parseInt(hex.slice(1,3),16); d[i+1]=parseInt(hex.slice(3,5),16);
      d[i+2]=parseInt(hex.slice(5,7),16); d[i+3]=255;
    }
  }
  const tmp = document.createElement('canvas');
  tmp.width = sprite.w; tmp.height = sprite.h;
  tmp.getContext('2d').putImageData(img, 0, 0);
  ctx.drawImage(tmp, Math.round(dx), Math.round(dy));
}

const iso = (tx, ty, ox, oy, lv=0) => [ (tx-ty)*32 + ox, (tx+ty)*16 + oy - lv*16 ];

window.LAB = {
  // ---- 1. the five grasses as big flat lawns, side by side, at 1x ----------
  lawns(n = 5, scale = 1) {
    const types = T.GRASS_TYPES;
    const W = types.length * (n*64 + 24) + 24, H = n*32 + 60;
    const ctx = section('lawns', W, H, scale, '#2A2620');
    types.forEach((ty, i) => {
      const ox = 12 + i*(n*64+24) + n*32;
      for (let b = 0; b < n; b++) for (let a = 0; a < n; a++) {
        const [sx, sy] = iso(a, b, ox, 24);
        blit(ctx, T.grassTile(ty, a + i*37, b), sx-32, sy-16);
      }
    });
    return 'lawns';
  },
  // ---- 2. one big map with all five as blobby regions ----------------------
  zones(N = 22, scale = 1, opts = {}) {
    const W = N*64+64, H = N*32+96;
    const ctx = section('zones', W, H, scale, '#2A2620');
    const ox = W/2, oy = 24;
    const claim = (tx,ty) => {
      // five soft blobs, deliberately overlapping so contested bands appear
      const c = [['thicket',4,4],['sward',15,5],['fen',5,15],['millefleurs',16,16]];
      let best='meadow', bs=0.9, second=0;
      for (const [t,cx,cy] of c) {
        const d = Math.hypot(tx-cx, ty-cy);
        const s = Math.max(0, 1 - d/8.5);
        if (s > bs) { second = bs; bs = s; best = t; }
        else if (s > second) second = s;
      }
      return { top: best, gap: bs - second, score: bs };
    };
    for (let ty = 0; ty < N; ty++) for (let tx = 0; tx < N; tx++) {
      const { top, gap } = claim(tx,ty);
      let sp;
      if (top === 'meadow') sp = T.grassTile('meadow', tx, ty);
      else if (gap < 0.055 && opts.contest !== false) {
        // find the runner-up
        const c = [['thicket',4,4],['sward',15,5],['fen',5,15],['millefleurs',16,16]];
        const ranked = c.map(([t,cx,cy])=>[t, Math.max(0,1-Math.hypot(tx-cx,ty-cy)/8.5)]).sort((a,b)=>b[1]-a[1]);
        sp = T.contestedTile(ranked[0][0], ranked[1][0], tx, ty);
      } else {
        // vertex mask against meadow
        let mask = 0;
        const own = (vx,vy) => {
          for (const [dx,dy] of [[0,0],[-1,0],[0,-1],[-1,-1]]) {
            const c = claim(vx+dx, vy+dy);
            if (c.top === top) return true;
          }
          return false;
        };
        if (own(tx,ty)) mask |= T.N;
        if (own(tx+1,ty)) mask |= T.E;
        if (own(tx+1,ty+1)) mask |= T.S;
        if (own(tx,ty+1)) mask |= T.W;
        sp = T.grassEdgeTile(top, mask, tx, ty);
      }
      const [sx, sy] = iso(tx, ty, ox, oy);
      blit(ctx, sp, sx-32, sy-16);
    }
    return 'zones';
  },
  // ---- 3. contested pairs, all ten -----------------------------------------
  contested(scale = 3) {
    const pairs = [];
    for (let i=0;i<T.GRASS_TYPES.length;i++) for (let j=i+1;j<T.GRASS_TYPES.length;j++)
      pairs.push([T.GRASS_TYPES[i], T.GRASS_TYPES[j]]);
    const ctx = section('contested', 5*68, 2*36+8, scale, '#2A2620');
    pairs.forEach(([a,b],i) => blit(ctx, T.contestedTile(a,b,i,0), (i%5)*68+2, Math.floor(i/5)*36+2));
    return 'contested';
  },
  // ---- 4. edge masks for one species ---------------------------------------
  edges(species = 'fen', scale = 3) {
    const ctx = section('edges-'+species, 8*68, 2*36+8, scale, '#2A2620');
    for (let m = 0; m < 16; m++)
      blit(ctx, T.grassEdgeTile(species, m, m, 0), (m%8)*68+2, Math.floor(m/8)*36+2);
    return 'edges-'+species;
  },
  // ---- 5. a cliff scene ----------------------------------------------------
  // Note the draw order per tile, which is the whole contract for elevation:
  //   faces (one per exposed side per level of drop, offset k*LEVEL_H)
  //   -> foot strip on the BOTTOM band -> the tile's own top diamond
  //   -> cap strip on the TOP band -> any splash.
  cliff(scale = 2, opts = {}) {
    const N = opts.N || 11;
    const W = N*64+96, H = N*32+220;
    const ctx = section('cliff', W, H, scale, '#2A2620');
    const ox = W/2, oy = 150;
    const lvl = opts.lvl || ((tx,ty) => (tx<0||ty<0||tx>=N||ty>=N) ? 0 : ty<=2 ? 5 : ty<=4 ? 2 : 0);
    const mat = opts.mat || ((tx) => ['rock','earth','wall','mossy'][Math.min(3, Math.floor(tx/3))]);
    const water = opts.water || ((tx,ty) => tx >= 4 && tx <= 5 && ty <= 4);
    const cells = [];
    for (let ty = 0; ty < N; ty++) for (let tx = 0; tx < N; tx++) cells.push([tx,ty]);
    cells.sort((a,b)=>(a[0]+a[1])-(b[0]+b[1]) || a[0]-b[0]);
    for (const [tx,ty] of cells) {
      const L = lvl(tx,ty);
      const [sx, sy] = iso(tx, ty, ox, oy, L);
      const w = water(tx,ty);
      const drops = { se: Math.max(0, L - lvl(tx+1,ty)), sw: Math.max(0, L - lvl(tx,ty+1)) };
      for (const side of ['sw','se']) {
        const n = drops[side];
        for (let k = 0; k < n; k++) {
          blit(ctx, w ? T.waterfallFaceFor(side) : T.cliffFaceFor(mat(tx,ty), side, tx, ty, k), sx-32, sy-16 + k*16);
        }
        if (n && !w) blit(ctx, T.cliffFootFor(mat(tx,ty), side, tx, ty), sx-32, sy-16 + (n-1)*16);
      }
      blit(ctx, w ? T.WATER[0] : T.grassTile(ty<=4?'sward':'meadow', tx, ty), sx-32, sy-16);
      for (const side of ['sw','se']) {
        if (!drops[side]) continue;
        blit(ctx, w ? T.waterfallLipFor(side, tx, ty)
                   : T.cliffCapFor(mat(tx,ty)==='wall'?'bare':'turf', side, tx, ty), sx-32, sy-16);
      }
      if (!w && water(tx,ty-1) && L < lvl(tx,ty-1)) blit(ctx, T.waterfallSplashFor(tx,ty), sx-32, sy-32);
    }
    return 'cliff';
  },
  // ---- 6. face strip at 4x --------------------------------------------------
  faces(scale = 4) {
    const mats = [...T.CLIFF_MATERIALS];
    const ctx = section('faces', 3*68+8, mats.length*54+8, scale, '#2A2620');
    mats.forEach((m,i) => [0,1,2].forEach((j) => {
      const cap = m === 'wall' ? 'bare' : 'turf';
      blit(ctx, T.GRASS[0], j*68+2, i*54+2);
      for (const side of ['sw','se']) {
        blit(ctx, T.CLIFF_FACES[m][side][j], j*68+2, i*54+2);
        blit(ctx, T.CLIFF_FEET[m][side][j], j*68+2, i*54+2);
        blit(ctx, T.CLIFF_CAPS[cap][side][j], j*68+2, i*54+2);
      }
    }));
    return 'faces';
  },
  // ---- 7. a tall waterfall, all six cycle phases ----------------------------
  fall(scale = 3) {
    const ctx = section('fall', 6*72, 140, scale, '#2A2620');
    for (let p = 0; p < 6; p++) {
      const r = pal.cycleWater(p);
      const ox = p*72+4;
      blit(ctx, T.WATER[0], ox, 4, r);
      for (const side of ['sw','se']) {
        for (let k = 0; k < 4; k++) blit(ctx, T.waterfallFaceFor(side), ox, 4+k*16, r);
        blit(ctx, T.waterfallLipFor(side, 0, 0), ox, 4, r);
      }
      blit(ctx, T.GRASS[0], ox, 4+4*16+8, r);
      blit(ctx, T.waterfallSplashFor(0,0), ox, 4+4*16+8-16, r);
    }
    return 'fall';
  },
  // ---- 8. grass with a tree on it, to check the load-bearing rule -----------
  withTree(scale = 2) {
    const types = T.GRASS_TYPES;
    const ctx = section('withtree', types.length*100, 120, scale, '#2A2620');
    types.forEach((ty,i) => {
      for (let b=0;b<3;b++) for (let a=0;a<3;a++) {
        const [sx,sy] = iso(a,b, i*100+50, 30);
        blit(ctx, T.grassTile(ty, a, b), sx-32, sy-16);
      }
      if (trees && trees.compose) {
        try {
          const sp = trees.compose('broadleaf', { seed: 7+i, stage: 'mature' });
          const [sx,sy] = iso(1,1, i*100+50, 30);
          blit(ctx, sp, sx-sp.anchor[0], sy-sp.anchor[1]);
        } catch(e) { window.LAB_ERR = String(e); }
      }
    });
    return 'withtree';
  },
  lint() {
    T.materialiseAll();
    const bad = [];
    for (const sp of Object.values(T.TILES)) bad.push(...fmt.lintSprite(sp, pal.PALETTE));
    return bad;
  },
  clear() { out.innerHTML=''; for (const k in CAN) delete CAN[k]; },
  async snap(title, name, zoom = 1) {
    let cv = CAN[title]; if (!cv) return 'no canvas ' + title;
    if (zoom > 1) {
      const big = document.createElement('canvas');
      big.width = cv.width*zoom; big.height = cv.height*zoom;
      const b = big.getContext('2d'); b.imageSmoothingEnabled = false;
      b.drawImage(cv, 0, 0, big.width, big.height);
      cv = big;
    }
    const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
    const res = await fetch('http://localhost:8823/snap?name='+encodeURIComponent(name||title), { method:'POST', body: blob });
    return res.text();
  },
};
window.LAB_READY = true;
</script>
