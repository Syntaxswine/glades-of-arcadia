<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Arcadia — decor lab</title>
<style>
  html,body{margin:0;background:#4a463d;color:#ded7c8;font:12px ui-monospace,Consolas,monospace}
  canvas{image-rendering:pixelated;display:block;margin:8px}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script type="module">
import { DECOR, VARIANTS } from '../js/art/decor.js';
import { resolve, RAMPS, variant } from '../js/palette.js';
import { decode } from '../js/art/format.js';

const q = new URLSearchParams(location.search);
const S = Number(q.get('scale') || 3);
const only = (q.get('only') || '').split(',').filter(Boolean);
const NAME = q.get('name') || 'decor';
const COLS = Number(q.get('cols') || 0);
const VAR = q.get('variant') || '';

const res = VAR && VARIANTS[VAR] ? VARIANTS[VAR] : resolve;

const entries = Object.entries(DECOR).filter(([k]) => !only.length || only.includes(k));

// ---- layout ---------------------------------------------------------------
const PAD = 10, LABEL = 14;
const cells = entries.map(([k, s]) => ({ k, s, w: s.w * S + PAD * 2, h: s.h * S + PAD * 2 + LABEL }));
const maxW = Math.max(...cells.map(c => c.w));
const perRow = COLS || Math.max(1, Math.min(cells.length, Math.floor(1600 / maxW)));
const rows = [];
for (let i = 0; i < cells.length; i += perRow) rows.push(cells.slice(i, i + perRow));
const W = Math.max(...rows.map(r => r.reduce((a, c) => a + c.w, 0)));
const H = rows.reduce((a, r) => a + Math.max(...r.map(c => c.h)), 0);

const cv = document.getElementById('cv');
cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

// ---- ground: the real grass values, so contrast is judged honestly --------
const G = RAMPS.grass.hex;
function ground(x0, y0, w, h) {
  const img = ctx.createImageData(w, h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const n = ((x * 7919) ^ (y * 104729)) >>> 0;
    const hex = G[(n % 97) < 12 ? 1 : (n % 97) > 88 ? 3 : 2];
    const i = (y * w + x) * 4;
    img.data[i] = parseInt(hex.slice(1,3),16);
    img.data[i+1] = parseInt(hex.slice(3,5),16);
    img.data[i+2] = parseInt(hex.slice(5,7),16);
    img.data[i+3] = 255;
  }
  ctx.putImageData(img, x0, y0);
}
ground(0, 0, W, H);

function blit(sp, x0, y0) {
  const rgba = decode(sp, res);
  const tmp = document.createElement('canvas');
  tmp.width = sp.w; tmp.height = sp.h;
  const timg = tmp.getContext('2d').createImageData(sp.w, sp.h);
  // decode() leaves transparent pixels at alpha 0 already (never written).
  timg.data.set(rgba);
  tmp.getContext('2d').putImageData(timg, 0, 0);
  ctx.drawImage(tmp, 0, 0, sp.w, sp.h, x0, y0, sp.w * S, sp.h * S);
}

ctx.font = '11px ui-monospace, monospace';
ctx.textBaseline = 'top';
let y = 0;
for (const row of rows) {
  const rh = Math.max(...row.map(c => c.h));
  let x = 0;
  for (const c of row) {
    // cell frame
    ctx.strokeStyle = 'rgba(0,0,0,.35)';
    ctx.strokeRect(x + .5, y + .5, c.w - 1, rh - 1);
    blit(c.s, x + PAD, y + PAD);
    // anchor cross — magenta, one pixel, at the anchor
    const ax = x + PAD + c.s.anchor[0] * S;
    const ay = y + PAD + c.s.anchor[1] * S;
    ctx.fillStyle = '#ff00ff';
    ctx.fillRect(ax, ay - 3 * S, S, 7 * S);
    ctx.fillRect(ax - 3 * S, ay, 7 * S, S);
    ctx.fillStyle = '#151310';
    ctx.fillRect(x + 2, y + rh - LABEL, c.w - 4, LABEL - 2);
    ctx.fillStyle = '#ded7c8';
    ctx.fillText(`${c.k} ${c.s.w}x${c.s.h}`, x + 5, y + rh - LABEL + 1);
    x += c.w;
  }
  y += rh;
}

cv.toBlob(b => {
  fetch(`http://localhost:8822/snap?name=${NAME}`, { method: 'POST', body: b })
    .then(r => r.text()).then(t => { document.title = 'snapped ' + t; });
}, 'image/png');
</script>
</body>
</html>
